# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: papermind
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker because uploaded papers live in process memory; threads handle concurrent requests.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: RATE_LIMIT_PER_HOUR
        value: "40"
